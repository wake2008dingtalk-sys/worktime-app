
name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create cordova-app com.example.worktime WorkTime
          cd cordova-app
          cordova platform add android

      - name: Copy web assets
        run: |
          cp index.html cordova-app/www/
          cp -r app-icon cordova-app/www/ 2>/dev/null || true
          cp manifest.json cordova-app/www/ 2>/dev/null || true
          cp sw.js cordova-app/www/ 2>/dev/null || true

      - name: Force APK output
        run: |
          cat > cordova-app/build.json << 'EOF'
          {
            "android": {
              "release": {
                "packageType": "apk"
              }
            }
          }
          EOF

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > cordova-app/worktime-release.keystore

      - name: Build unsigned APK
        run: |
          cd cordova-app
          cordova build android --release

      
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED_APK=cordova-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED_APK=cordova-app/platforms/android/app/build/outputs/apk/release/app-release.apk
          KEYSTORE=$(pwd)/cordova-app/worktime-release.keystore
          # 第一步：先 zipalign 对齐（未签名 → 对齐后的 APK）
          $BUILD_TOOLS/zipalign -p -f -v 4 $UNSIGNED_APK $SIGNED_APK
          # 第二步：再用 apksigner 签名（生成 V2 签名，现代 Android 兼容）
          $BUILD_TOOLS/apksigner sign --ks $KEYSTORE --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD --ks-key-alias $KEY_ALIAS $SIGNED_APK
          # 第三步：验证签名真的写入了（失败会直接报错，不会静默通过）
          $BUILD_TOOLS/apksigner verify -v $SIGNED_APK || exit 1


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: cordova-app/platforms/android/app/build/outputs/apk/release/app-release.apk

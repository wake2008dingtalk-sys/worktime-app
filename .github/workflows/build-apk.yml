
name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create cordova-app com.example.worktime WorkTime
          cd cordova-app
          cordova platform add android

      - name: Copy web assets
        run: |
          cp index.html cordova-app/www/
      
      - name: Build unsigned APK
        run: |
          cd cordova-app
          cordova build android --release

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED_APK=cordova-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED_APK=cordova-app/platforms/android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore worktime-release.keystore -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD $UNSIGNED_APK $KEY_ALIAS
          $BUILD_TOOLS/zipalign -v 4 $UNSIGNED_APK $SIGNED_APK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: cordova-app/platforms/android/app/build/outputs/apk/release/app-release.apk
      
      
